services:

  mysql:
    image: mysql:8.4
    container_name: adivinatuitt_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: adivinatuitt_backend
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      - mysql

  frontend:
    build: ./frontend
    container_name: adivinatuitt_frontend
    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - backend

volumes:
  mysql_data: